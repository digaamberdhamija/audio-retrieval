database:
  host: localhost
  port: 5433
  name: app
  user: postgres
  password: postgres

transcription:
  model: gemini-3.5-transcribe
  language_codes: []
  expected_speakers: 2
  request_timeout_seconds: 900
  output_dir: outputs

embedding:
  model: gemini-embedding-2
  dimensions: 768
  batch_size: 50
  query_prefix: ""
  document_prefix: ""

windows:
  - length_seconds: 30
    stride_seconds: 15
    merge_overlap_seconds: 5
    max_merged_seconds: 90
  - length_seconds: 60
    stride_seconds: 30
    merge_overlap_seconds: 15
    max_merged_seconds: 180
  - length_seconds: 120
    stride_seconds: 60
    merge_overlap_seconds: 30
    max_merged_seconds: 300

search:
  text_search_language: english
  candidates_per_search: 20
  text_weight: 0.4
  semantic_weight: 0.6
  rrf_k: 60
  merge_overlaps: true
  dedupe_overlap_seconds: 20
  top_k: 5

reranker:
  strategy: gemini
  colbert:
    model: lightonai/GTE-ModernColBERT-v1
    query_length: 128
    document_length: 2048
    batch_size: 8
    gpu_dtype: float16
  qwen3:
    model: Qwen/Qwen3-Reranker-4B
    instruction: Given a question about a recorded conversation, retrieve transcript passages that answer the question
    batch_size: 8
    dtype: bfloat16
    max_gpu_memory: 4GiB
    max_cpu_memory: 24GiB
  gemini:
    model: gemini-3.8-flash
    thinking_level: LOW
    instruction: >-
      You judge passages from transcripts of recorded two-speaker conversations. For every passage, score from 0 to
      100 how well it answers the question: 100 means it answers the question directly, 0 means it is unrelated.

eval:
  api_url: http://localhost:8000
  dataset_path: evals/dataset.yaml
  k_values: [1, 3, 5, 10]
  min_span_coverage: 0.5
